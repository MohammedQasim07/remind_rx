name: remind_rx
description: "A new Flutter project for Medicine Reminder System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.1.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  get_it: ^7.6.7
  injectable: ^2.4.0
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  uuid: ^4.3.3
  dio: ^5.4.1
  retrofit: 4.1.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: 2.4.9
  isar_generator: ^3.1.0+1
  injectable_generator: ^2.4.1
  json_serializable: ^6.8.0
  retrofit_generator: 8.1.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
